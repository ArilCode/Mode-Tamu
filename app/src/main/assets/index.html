<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mode ACE</title>
<style>
:root{--bg:#0B1020;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.09);--tx:#EAF0FF;--mu:#8A94B8;--a1:#4FD1FF;--a2:#7C5CFF;--ok:#2DE2A6;--bad:#FF5C7A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{background:radial-gradient(120% 55% at 50% -8%,rgba(92,112,255,.35),transparent 70%),radial-gradient(80% 40% at 100% 100%,rgba(124,92,255,.18),transparent 70%),var(--bg)}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.page{flex:1;overflow-y:auto;padding:22px 18px 14px;animation:fade .35s ease}
.page::-webkit-scrollbar{display:none}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.3px}
h2{font-size:21px;margin:0 0 6px}
h3{margin:0 0 6px;font-size:18px}
p{margin:0 0 12px;line-height:1.5}
.mu{color:var(--mu);font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.brand{font-weight:800;font-size:20px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.brand b{background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{font-size:12px;padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.off{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;backdrop-filter:blur(8px)}
.warn{border-color:rgba(255,92,122,.4);background:rgba(255,92,122,.08)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line);margin:0}
.stat b{display:block;font-size:30px;background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:13px;color:var(--mu)}
.btn{border:0;border-radius:16px;padding:15px 18px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));width:100%;box-shadow:0 10px 24px rgba(92,112,255,.35);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);box-shadow:none;border:1px solid var(--line);color:var(--tx)}
.btn.sm{padding:10px 14px;font-size:14px;width:auto;border-radius:12px}
.link{background:none;border:0;color:var(--a1);font-size:14px;padding:10px;width:100%}
.inp{width:100%;padding:15px 16px;margin-bottom:10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx);font-size:16px;outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(79,209,255,.15)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:8px}
.row{display:flex;gap:10px}
.nav{display:flex;padding:8px 10px;background:rgba(11,16,32,.9);border-top:1px solid var(--line)}
.nav button{flex:1;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;padding:8px 0;border-radius:14px;transition:.2s}
.nav button.on{color:var(--a1);background:rgba(79,209,255,.08)}
.pwwrap{position:relative;width:min(58vw,240px);aspect-ratio:1;margin:22px auto 16px;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(79,209,255,.35);animation:pulse 3.2s ease-out infinite}
.ring.r2{animation-delay:1.6s}
@keyframes pulse{0%{transform:scale(.72);opacity:.9}100%{transform:scale(1.3);opacity:0}}
.power{width:72%;aspect-ratio:1;border-radius:50%;border:0;color:#CFE0FF;background:linear-gradient(145deg,#2B3566,#171E40);box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14),0 0 0 7px rgba(255,255,255,.04);display:grid;place-items:center;transition:all .5s}
.power:active{transform:scale(.94)}
.pwwrap.act .power{background:linear-gradient(145deg,#2DE2A6,#15A9FF);color:#fff;box-shadow:0 0 70px rgba(45,226,166,.6),inset 0 1px 0 rgba(255,255,255,.4)}
.pwwrap.act .power svg{animation:pop .7s}
.pwwrap.act .ring{border-color:rgba(45,226,166,.7);animation-duration:.9s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(12deg)}100%{transform:scale(1)}}
.burst{position:fixed;left:50%;top:40%;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,rgba(79,209,255,.9),rgba(124,92,255,.4) 60%,transparent 70%);transform:translate(-50%,-50%) scale(0);animation:burst .95s ease-out forwards;pointer-events:none;z-index:60}
.burst.green{background:radial-gradient(circle,rgba(45,226,166,.9),rgba(21,169,255,.4) 60%,transparent 70%)}
@keyframes burst{to{transform:translate(-50%,-50%) scale(70);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.gate{display:flex;flex-direction:column;justify-content:center;min-height:100%}
.lockbig{position:relative;width:130px;height:130px;margin:0 auto 20px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#3A2A7A,#1A1F4A);color:#fff;box-shadow:0 0 50px rgba(124,92,255,.45);transition:all .5s}
.lockbig:before,.lockbig:after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(124,92,255,.5);animation:pulse 3s ease-out infinite}
.lockbig:after{animation-delay:1.5s}
.lockbig.ok{background:linear-gradient(145deg,#2DE2A6,#15A9FF);box-shadow:0 0 60px rgba(45,226,166,.6)}
.lockbig.ok svg{animation:pop .7s}
.lockbig.in svg{animation:lockin .6s}
@keyframes lockin{0%{transform:scale(1.6);opacity:0}100%{transform:scale(1);opacity:1}}
.search{display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin:10px 0}
.search input{flex:1;background:none;border:0;outline:0;color:var(--tx);font-size:16px;padding:14px 0;-webkit-user-select:text;user-select:text}
.app{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px}
.app img{width:42px;height:42px;border-radius:10px;flex:none;background:#222}
.an{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk{height:62px;border-radius:16px;margin-bottom:8px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.1),rgba(255,255,255,.04));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{display:none}
.sw i{position:absolute;inset:0;border-radius:20px;background:#2A3358;transition:.25s}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s}
.sw input:checked+i{background:linear-gradient(135deg,var(--a1),var(--a2))}
.sw input:checked+i:after{transform:translateX(20px)}
.pill{display:inline-block;font-size:12px;padding:4px 10px;border-radius:12px;background:rgba(79,209,255,.12);color:var(--a1)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.tile{padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;transition:.25s;position:relative}
.tile .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.07);transition:.25s}
.tile.on{border-color:rgba(79,209,255,.6);background:rgba(79,209,255,.09);box-shadow:0 0 24px rgba(79,209,255,.15)}
.tile.on .ic{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.tile small{color:var(--mu);font-size:12px}
.tile .lk{position:absolute;right:12px;top:12px;color:var(--a1);opacity:0;transition:.25s}
.tile.on .lk{opacity:1}
.item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;width:100%;color:var(--tx);text-align:left;font-size:16px}
.item .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(79,209,255,.2),rgba(124,92,255,.25));color:var(--a1);flex:none}
.item div{flex:1}.item small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.back{background:none;border:0;color:var(--a1);display:flex;align-items:center;gap:4px;font-size:15px;padding:0 0 12px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:.25s;z-index:70;pointer-events:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#141A38;border-radius:26px 26px 0 0;padding:14px 20px 24px;transform:translateY(100%);transition:.3s;z-index:80;border-top:1px solid var(--line)}
#sheet-root.open .scrim{opacity:1;pointer-events:auto}
#sheet-root.open .sheet{transform:none}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#1E2650;border:1px solid var(--line);padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;transition:.3s;z-index:90;max-width:88%;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast"></div>
<script>
const A = window.Ace;
const J = s => JSON.parse(s);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P = {
  home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  apps:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  panel:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  power:'<path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  unlock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  data:'<path d="M5 20v-4M10 20v-8M15 20V8M20 20V4"/>',
  airplane:'<path d="M21 15l-8-4V5a1 1 0 0 0-2 0v6l-8 4v2l8-2v4l-2 1.5V21l3-.8 3 .8v-1.5L13 18v-4l8 2z"/>',
  wifi:'<path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1"/>',
  hotspot:'<circle cx="12" cy="12" r="2"/><path d="M8 8a5.7 5.7 0 0 0 0 8M16 8a5.7 5.7 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/>',
  bluetooth:'<path d="M7 7l10 10-5 5V2l5 5L7 17"/>',
  location:'<path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
  eyeoff:'<path d="M3 3l18 18M10.6 6.2A9.8 9.8 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-3 3.6M6.5 7.5A16 16 0 0 0 2.5 12S6 18 12 18c1.5 0 2.8-.4 4-1"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h0"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',
  tile:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',
  access:'<circle cx="12" cy="4.5" r="2"/><path d="M5 8h14M12 8v6M8 21l4-7 4 7"/>'
};
const ico = (n, s = 24) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

let st = {}, tab = 'home', sub = null, apps = null, q = '', sheetOpen = false;
const TOG = [
  {id:'data', n:'Data seluler'}, {id:'airplane', n:'Mode pesawat'}, {id:'wifi', n:'Wi-Fi'},
  {id:'hotspot', n:'Hotspot'}, {id:'bluetooth', n:'Bluetooth'}, {id:'location', n:'Lokasi'}
];

function refresh() { st = J(A.state()); render(); }
window.refresh = refresh;
window.onBack = function () {
  if (sheetOpen) { closeSheet(); return true; }
  if (sub) { sub = null; q = ''; render(); return true; }
  if (!st.guest && tab !== 'home') { tab = 'home'; render(); return true; }
  return false;
};

function toast(m) {
  const t = $('#toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400);
}
function shake(sel) { const e = $(sel); if (!e) return; e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); }
function burst(green) {
  const b = document.createElement('div'); b.className = 'burst' + (green ? ' green' : '');
  document.body.appendChild(b); setTimeout(() => b.remove(), 1000);
}

function sheet(o) {
  const r = $('#sheet-root');
  r.innerHTML = `<div class="scrim" onclick="closeSheet()"></div><div class="sheet"><div class="grab"></div><h3>${o.title}</h3>${o.desc ? `<p class="mu">${o.desc}</p>` : ''}${o.fields.map(f => `<input id="f_${f.id}" class="inp" type="password" placeholder="${f.ph}" autocomplete="off">`).join('')}<div class="err" id="serr"></div><div class="row"><button class="btn ghost" onclick="closeSheet()">Batal</button><button class="btn" id="sok">${o.ok || 'Simpan'}</button></div></div>`;
  sheetOpen = true;
  requestAnimationFrame(() => requestAnimationFrame(() => r.classList.add('open')));
  $('#sok').onclick = () => {
    const v = {}; o.fields.forEach(f => v[f.id] = $('#f_' + f.id).value);
    const m = o.onOk(v);
    if (m === true) closeSheet(); else if (m) $('#serr').textContent = m;
  };
}
function closeSheet() {
  sheetOpen = false; const r = $('#sheet-root'); r.classList.remove('open');
  setTimeout(() => { if (!sheetOpen) r.innerHTML = ''; }, 320);
}
const R = res => res.ok ? true : (res.msg || 'Gagal');

function render() {
  if (!st.setup) return renderSetup();
  if (st.guest) return renderGate();
  renderMain();
}

function renderSetup() {
  $('#app').innerHTML = `<div class="page"><div class="top"><div class="brand">${ico('shield', 26)}<b>ACE</b></div></div>
  <h1>Selamat datang</h1><p class="mu">Buat kode awal untuk mengunci Mode ACE. Kode ini dipakai untuk menonaktifkan mode tamu. Pertanyaan keamanan dipakai jika Anda lupa kode.</p>
  <input id="s_pin" class="inp" type="password" placeholder="Kode awal / sandi (min. 4)">
  <input id="s_pin2" class="inp" type="password" placeholder="Ulangi kode">
  <input id="s_q" class="inp" type="text" placeholder="Pertanyaan keamanan (mis. Nama hewan pertama?)">
  <input id="s_a" class="inp" type="password" placeholder="Jawaban pertanyaan">
  <div class="err" id="serr"></div>
  <button class="btn" onclick="doSetup()">Mulai</button></div>`;
}
function doSetup() {
  if ($('#s_pin').value !== $('#s_pin2').value) { $('#serr').textContent = 'Kode tidak sama'; return; }
  const r = J(A.setup($('#s_pin').value, $('#s_q').value, $('#s_a').value));
  if (!r.ok) { $('#serr').textContent = r.msg; return; }
  refresh(); toast('Kode berhasil dibuat');
}

function renderGate() {
  $('#app').innerHTML = `<div class="page"><div class="gate">
  <div class="lockbig in" id="lk">${ico('lock', 58)}</div>
  <h1 style="text-align:center">Sedang di mode tamu</h1>
  <p class="mu" style="text-align:center">Masukkan kode untuk kembali ke mode owner.</p>
  <input id="g_pin" class="inp" type="password" placeholder="Kode awal" onkeydown="if(event.key==='Enter')doOff()">
  <div class="err" id="serr"></div>
  <button class="btn" onclick="doOff()">Nonaktifkan mode tamu</button>
  <button class="link" onclick="forgotPin()">Lupa kode?</button></div></div>`;
}
function doOff() {
  const r = J(A.deactivate($('#g_pin').value));
  if (!r.ok) { $('#serr').textContent = r.msg; shake('#g_pin'); return; }
  const lk = $('#lk'); lk.classList.remove('in'); lk.classList.add('ok'); lk.innerHTML = ico('unlock', 58);
  burst(true);
  setTimeout(refresh, 1000);
}
function forgotPin() {
  sheet({title:'Lupa kode', desc:'Jawab pertanyaan: <b>' + esc(st.question) + '</b>', ok:'Reset kode',
    fields:[{id:'a', ph:'Jawaban'}, {id:'n', ph:'Kode baru (min. 4)'}],
    onOk: v => { const r = J(A.forgotPin(v.a, v.n)); if (r.ok) { refresh(); toast('Kode direset, mode tamu nonaktif'); } return R(r); }});
}

function renderMain() {
  const nav = `<div class="nav">${[['home','Beranda'],['apps','Aplikasi'],['panel','Panel'],['menu','Menu']].map(t => `<button class="${tab === t[0] ? 'on' : ''}" onclick="go('${t[0]}')">${ico(t[0], 22)}${t[1]}</button>`).join('')}</div>`;
  let body = sub === 'vault' ? vaultV() : tab === 'home' ? homeV() : tab === 'apps' ? appsV() : tab === 'panel' ? panelV() : menuV();
  $('#app').innerHTML = `<div class="page" id="page">${body}</div>${sub ? '' : nav}`;
  if ((tab === 'apps' && !sub) || (sub === 'vault' && st.vaultUnlocked)) loadList(sub === 'vault' ? 'v' : 'l');
}
function go(t) { tab = t; sub = null; q = ''; render(); }

function homeV() {
  return `<div class="top"><div class="brand">${ico('shield', 26)}<b>ACE</b></div>
  <div class="chip"><span class="dot ${st.service ? '' : 'off'}"></span>${st.service ? 'Penjaga aktif' : 'Penjaga mati'}</div></div>
  <div class="pwwrap" id="pwwrap"><div class="ring"></div><div class="ring r2"></div><button class="power" id="pw" onclick="doOn()">${ico('power', 78)}</button></div>
  <h2 style="text-align:center">Mode Owner</h2>
  <p class="mu" style="text-align:center">Semua aplikasi terbuka. Ketuk tombol untuk masuk ke mode tamu.</p>
  ${!st.service ? `<div class="card warn"><b>Layanan penjaga belum aktif</b><p class="mu" style="margin:6px 0 12px">Aktifkan Mode ACE di Aksesibilitas agar pemblokiran berjalan.</p><button class="btn sm" onclick="A.openAccessibility()">Buka Aksesibilitas</button></div>` : ''}
  <div class="grid2"><div class="stat" onclick="go('apps')"><b>${st.lockedCount}</b><span>Aplikasi dikunci</span></div>
  <div class="stat" onclick="go('panel')"><b>${st.toggles.length}</b><span>Panel dikunci</span></div></div>`;
}
function doOn() {
  const r = J(A.activate());
  if (!r.ok) { shake('#pwwrap'); toast(r.msg); if (r.go) setTimeout(() => go(r.go), 700); return; }
  $('#pwwrap').classList.add('act'); burst(false);
  setTimeout(refresh, 1100);
}

function appsV() {
  return `<h1>Aplikasi</h1><p class="mu">Aplikasi yang dicentang tidak bisa dibuka saat mode tamu.</p>
  <div class="search">${ico('search', 20)}<input id="q" placeholder="Cari aplikasi" oninput="onQ(this.value,'l')"></div>
  <div style="margin-bottom:10px"><span class="pill" id="cnt">${st.lockedCount} dikunci</span></div><div id="list">${'<div class="sk"></div>'.repeat(6)}</div>`;
}
function loadList(mode) {
  const draw = () => { const l = $('#list'); if (l) l.innerHTML = listHTML(mode); };
  if (apps) return draw();
  setTimeout(() => { apps = J(A.apps()); draw(); }, 80);
}
function listHTML(mode) {
  const f = apps.filter(a => a.n.toLowerCase().includes(q.toLowerCase()));
  if (!f.length) return '<p class="mu" style="text-align:center;margin-top:30px">Tidak ada aplikasi</p>';
  return f.map(a => `<div class="app"><img src="data:image/png;base64,${a.i}"><div class="an">${esc(a.n)}</div><label class="sw"><input type="checkbox" ${a[mode] ? 'checked' : ''} onchange="tgl('${a.p}',this.checked,'${mode}',this)"><i></i></label></div>`).join('');
}
function onQ(v, mode) { q = v; $('#list').innerHTML = listHTML(mode); }
function tgl(p, on, mode, el) {
  const r = J(mode === 'l' ? A.setLocked(p, on) : A.vaultSetApp(p, on));
  if (!r.ok) { toast(r.msg); el.checked = !on; return; }
  apps.find(x => x.p === p)[mode] = on;
  st = J(A.state());
  const c = $('#cnt'); if (c) c.textContent = mode === 'l' ? st.lockedCount + ' dikunci' : st.vaultCount + ' disembunyikan';
}

function panelV() {
  return `<h1>Panel Cepat</h1><p class="mu">Pilih tombol yang tidak bisa dipakai saat mode tamu. Yang tidak dipilih tetap bebas.</p>
  <div class="tiles">${TOG.map(t => { const on = st.toggles.includes(t.id); return `<div class="tile ${on ? 'on' : ''}" onclick="tglPanel('${t.id}',${!on})"><span class="lk">${ico('lock', 16)}</span><div class="ic">${ico(t.id, 24)}</div><div><b>${t.n}</b><br><small>${on ? 'Dikunci' : 'Bebas'}</small></div></div>`; }).join('')}</div>
  <div class="card"><p class="mu" style="margin:0">Pemblokiran dibaca dari tampilan panel HP, jadi bisa berbeda di tiap HP. Jika ada tombol yang lolos, kabari saya nama tombolnya.</p></div>`;
}
function tglPanel(id, on) {
  const r = J(A.setToggle(id, on)); if (!r.ok) return toast(r.msg);
  st = J(A.state()); render();
}

function menuV() {
  const it = (ic, t, s, fn) => `<button class="item" onclick="${fn}"><span class="ic">${ico(ic, 22)}</span><div>${t}<small>${s}</small></div><span style="color:var(--mu)">${ico('chev', 18)}</span></button>`;
  return `<h1>Menu</h1><p class="mu">Pengaturan lainnya</p>
  ${it('eyeoff', 'Sembunyikan Aplikasi (Brankas)', st.vaultCount + ' aplikasi di brankas', "openVault()")}
  ${it('key', 'Ubah kode awal', 'Perlu kode awal lama', 'changePin()')}
  ${it('access', 'Layanan aksesibilitas', st.service ? 'Aktif' : 'Belum aktif, ketuk untuk membuka', 'A.openAccessibility()')}
  ${it('tile', 'Tambah ke panel cepat', 'Ikon Mode ACE di deretan tombol atas', 'A.addTile()')}
  ${it('info', 'Tentang', 'Mode ACE 1.0', "toast('Mode ACE 1.0')")}`;
}
function changePin() {
  sheet({title:'Ubah kode awal', fields:[{id:'o', ph:'Kode awal lama'}, {id:'n', ph:'Kode baru (min. 4)'}],
    onOk: v => { const r = J(A.changePin(v.o, v.n)); if (r.ok) toast('Kode diubah'); return R(r); }});
}

function openVault() { sub = 'vault'; q = ''; render(); }
function vaultV() {
  const back = `<button class="back" onclick="window.onBack();">${ico('back', 20)} Kembali</button>`;
  const note = `<div class="card"><p class="mu" style="margin:0">Aplikasi di brankas selalu diblokir, di mode owner juga, sampai Anda membuka akses sementara. Ikonnya tetap terlihat karena Android tidak mengizinkan aplikasi biasa menyembunyikan ikon.</p></div>`;
  if (!st.vaultSet) return `${back}<h1>Buat kode unik</h1><p class="mu">Kode ini hanya untuk membuka brankas.</p>${note}
    <input id="v1" class="inp" type="password" placeholder="Kode unik (min. 4)"><input id="v2" class="inp" type="password" placeholder="Ulangi kode unik"><div class="err" id="serr"></div>
    <button class="btn" onclick="vaultCreate()">Buat kode unik</button>`;
  if (!st.vaultUnlocked) return `${back}<h1>Brankas terkunci</h1><p class="mu">Masukkan kode unik.</p>
    <input id="v1" class="inp" type="password" placeholder="Kode unik" onkeydown="if(event.key==='Enter')vaultEnter()"><div class="err" id="serr"></div>
    <button class="btn" onclick="vaultEnter()">Buka brankas</button><button class="link" onclick="vaultForgot()">Lupa kode unik?</button>`;
  const open = st.vaultOpenUntil > st.now;
  return `${back}<h1>Brankas</h1>${note}
  <div class="row" style="margin-bottom:10px"><button class="btn sm" style="flex:1" onclick="grant(${open ? 0 : 10})">${open ? 'Kunci lagi sekarang' : 'Buka akses 10 menit'}</button><button class="btn ghost sm" onclick="vaultChange()">Ubah kode</button></div>
  <div class="search">${ico('search', 20)}<input id="q" placeholder="Cari aplikasi" oninput="onQ(this.value,'v')"></div>
  <div style="margin-bottom:10px"><span class="pill" id="cnt">${st.vaultCount} disembunyikan</span>${open ? ' <span class="pill">Akses sementara aktif</span>' : ''}</div>
  <div id="list">${'<div class="sk"></div>'.repeat(5)}</div>`;
}
function vaultCreate() {
  if ($('#v1').value !== $('#v2').value) { $('#serr').textContent = 'Kode tidak sama'; return; }
  const r = J(A.vaultSetup($('#v1').value)); if (!r.ok) { $('#serr').textContent = r.msg; return; }
  refresh(); toast('Kode unik dibuat');
}
function vaultEnter() {
  const r = J(A.vaultOpen($('#v1').value)); if (!r.ok) { $('#serr').textContent = r.msg; shake('#v1'); return; }
  refresh();
}
function grant(m) { const r = J(A.vaultGrant(m)); if (!r.ok) return toast(r.msg); toast(m ? 'Akses dibuka 10 menit' : 'Brankas dikunci'); refresh(); }
function vaultChange() {
  sheet({title:'Ubah kode unik', fields:[{id:'o', ph:'Kode unik lama'}, {id:'n', ph:'Kode unik baru (min. 4)'}],
    onOk: v => { const r = J(A.vaultChange(v.o, v.n)); if (r.ok) toast('Kode unik diubah'); return R(r); }});
}
function vaultForgot() {
  sheet({title:'Lupa kode unik', desc:'Jawab pertanyaan: <b>' + esc(st.question) + '</b><br>Jika benar, kode unik direset dan semua aplikasi kembali ke normal.', ok:'Reset',
    fields:[{id:'a', ph:'Jawaban'}],
    onOk: v => { const r = J(A.vaultForgot(v.a)); if (r.ok) { apps = null; refresh(); toast('Kode unik direset, aplikasi dikembalikan'); } return R(r); }});
}

refresh();
</script>
</body>
</html>
